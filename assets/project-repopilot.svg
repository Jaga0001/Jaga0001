<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p1-t" preserveAspectRatio="xMidYMid meet">
  <title id="p1-t">Repo-Pilot: Autonomous Self-Healing CI/CD Pipeline</title>
  <defs>
    <linearGradient id="p1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1711"/><stop offset="1" stop-color="#050c08"/></linearGradient>
    <radialGradient id="p1-glow" cx="80%" cy="30%" r="55%"><stop offset="0" stop-color="#059669" stop-opacity=".45"/><stop offset="1" stop-color="#047857" stop-opacity="0"/></radialGradient>
    <pattern id="p1-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#10b981" stroke-opacity=".07"/></pattern>
    <clipPath id="p1-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="370" fill="url(#p1-bg)"/>
    <rect x="700" width="500" height="370" fill="url(#p1-grid)"/>
    <rect width="1200" height="370" fill="url(#p1-glow)"/>
    
    <!-- Left Column (x=56, strictly separated from right x=730) -->
    <text class="p1-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#34d399">01 · AUTONOMOUS AGENT · CI/CD · RAG · MARCH 2026</text>
    <text class="p1-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.2" fill="#f0fdf4">Repo-Pilot</text>
    <text class="p1-sans" x="56" y="154" font-size="16.5" fill="#a7f3d0">Autonomous self-healing CI/CD pipeline resolving build and deployment failures.</text>
    <text class="p1-mono" x="56" y="186" font-size="12" fill="#6ee7b7"><tspan fill="#34d399">BUILT ›</tspan> Automated error detection, Elasticsearch log indexing, LLM-powered root-cause repair</text>
    <line x1="56" y1="212" x2="680" y2="212" stroke="#10b981" stroke-opacity=".25"/>
    
    <!-- Metrics Row -->
    <g transform="translate(56 248)">
      <text class="p1-serif" font-size="30" font-weight="300" fill="#f0fdf4">Real-Time</text>
      <text class="p1-sans" y="22" font-size="12" fill="#94a3b8">failure detection &amp; patch</text>
    </g>
    <g transform="translate(250 248)">
      <text class="p1-serif" font-size="30" font-weight="300" fill="#f0fdf4">Elasticsearch</text>
      <text class="p1-sans" y="22" font-size="12" fill="#94a3b8">log indexing &amp; fast retrieval</text>
    </g>
    <g transform="translate(450 248)">
      <text class="p1-serif" font-size="30" font-weight="300" fill="#f0fdf4">Self-Healing</text>
      <text class="p1-sans" y="22" font-size="12" fill="#94a3b8">automated retry workflows</text>
    </g>

    <!-- Chips Row -->
    <g transform="translate(56 308)">
      <rect x="0" width="76" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p1-mono" x="38" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">FastAPI</text>

      <rect x="86" width="70" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p1-mono" x="121" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Python</text>

      <rect x="166" width="60" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p1-mono" x="196" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">LLMs</text>

      <rect x="236" width="56" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p1-mono" x="264" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">RAG</text>

      <rect x="302" width="86" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p1-mono" x="345" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Vector DB</text>

      <rect x="398" width="112" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p1-mono" x="454" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Elasticsearch</text>
    </g>

    <!-- Right-Side Visual Card (x=730, y=45, w=420, h=280) -->
    <g transform="translate(730 45)">
      <rect width="420" height="280" rx="16" fill="#0b1b12" stroke="#10b981" stroke-opacity=".35"/>
      <path d="M0 16 a16 16 0 0 1 16 -16 H404 a16 16 0 0 1 16 16 V34 H0 Z" fill="#0f261a"/>
      <circle cx="20" cy="17" r="4" fill="#10b981"/><circle cx="32" cy="17" r="4" fill="#047857"/><circle cx="44" cy="17" r="4" fill="#064e3b"/>
      <text class="p1-mono" x="210" y="21" text-anchor="middle" font-size="10.5" fill="#6ee7b7">CI/CD // SELF_HEALING_AGENT</text>

      <!-- Step Nodes -->
      <g transform="translate(24 60)">
        <!-- Step 1 -->
        <rect width="104" height="42" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".4"/>
        <text class="p1-mono" x="52" y="25" text-anchor="middle" font-size="10" fill="#a7f3d0">GIT COMMIT</text>

        <line x1="104" y1="21" x2="134" y2="21" stroke="#34d399" stroke-width="1.5"/>

        <!-- Step 2 -->
        <rect x="134" width="104" height="42" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".4"/>
        <text class="p1-mono" x="186" y="25" text-anchor="middle" font-size="10" fill="#a7f3d0">BUILD TEST</text>
        
        <line x1="238" y1="21" x2="268" y2="21" stroke="#34d399" stroke-width="1.5"/>

        <!-- Step 3 -->
        <rect x="268" width="104" height="42" rx="8" fill="#171205" stroke="#eab308" stroke-opacity=".6"/>
        <text class="p1-mono" x="320" y="25" text-anchor="middle" font-size="10" fill="#fde047">ERROR CATCH</text>
      </g>

      <!-- Agent Healing Console Box -->
      <g transform="translate(24 130)">
        <rect width="372" height="120" rx="10" fill="#06120b" stroke="#10b981" stroke-opacity=".4"/>
        <text class="p1-mono" x="16" y="28" font-size="11" fill="#34d399">● AGENT DETECTED: Build Failure Exception</text>
        <text class="p1-mono" x="16" y="52" font-size="10.5" fill="#a7f3d0">&gt; Querying VectorDB &amp; codebase context...</text>
        <text class="p1-mono" x="16" y="76" font-size="10.5" fill="#fde047">&gt; Generated diff patch &amp; created self-healing PR</text>
        <text class="p1-mono" x="16" y="100" font-size="10.5" fill="#6ee7b7">&gt; Status: RESOLVED · Pipeline Passed (0s manual work)</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#10b981" stroke-opacity=".2"/>
  </g>
</svg>