<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">ATOM: AI-Powered Pre-Incident Forecasting for Reliable Systems</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1711"/><stop offset="1" stop-color="#050c08"/></linearGradient>
    <radialGradient id="p2-glow" cx="80%" cy="30%" r="55%"><stop offset="0" stop-color="#059669" stop-opacity=".45"/><stop offset="1" stop-color="#047857" stop-opacity="0"/></radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#10b981" stroke-opacity=".07"/></pattern>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="700" width="500" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    
    <!-- Left Column -->
    <text class="p2-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#34d399">02 · PREDICTIVE RELIABILITY · TIME-SERIES · AGENTS · 2026</text>
    <text class="p2-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.2" fill="#f0fdf4">ATOM</text>
    <text class="p2-sans" x="56" y="154" font-size="16.5" fill="#a7f3d0">AI-powered pre-incident forecasting platform for system reliability &amp; uptime.</text>
    <text class="p2-mono" x="56" y="186" font-size="12" fill="#6ee7b7"><tspan fill="#34d399">BUILT ›</tspan> Time-series modeling, anomaly forecasting, proactive health scoring &amp; alerts</text>
    <line x1="56" y1="212" x2="680" y2="212" stroke="#10b981" stroke-opacity=".25"/>
    
    <!-- Metrics Row -->
    <g transform="translate(56 248)">
      <text class="p2-serif" font-size="30" font-weight="300" fill="#f0fdf4">Top 12</text>
      <text class="p2-sans" y="22" font-size="12" fill="#94a3b8">Beach Hacks S07 Finalist</text>
    </g>
    <g transform="translate(250 248)">
      <text class="p2-serif" font-size="30" font-weight="300" fill="#f0fdf4">Proactive</text>
      <text class="p2-sans" y="22" font-size="12" fill="#94a3b8">pre-incident detection</text>
    </g>
    <g transform="translate(450 248)">
      <text class="p2-serif" font-size="30" font-weight="300" fill="#f0fdf4">Time-Series</text>
      <text class="p2-sans" y="22" font-size="12" fill="#94a3b8">telemetry anomaly modeling</text>
    </g>

    <!-- Chips Row -->
    <g transform="translate(56 308)">
      <rect x="0" width="76" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p2-mono" x="38" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">FastAPI</text>

      <rect x="86" width="70" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p2-mono" x="121" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Python</text>

      <rect x="166" width="70" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p2-mono" x="201" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Agents</text>

      <rect x="246" width="100" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p2-mono" x="296" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Time-Series</text>

      <rect x="356" width="140" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p2-mono" x="426" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Beach Hacks '26</text>
    </g>

    <!-- Right-Side Visual: Telemetry Forecast Monitor (x=730, y=45, w=420, h=280) -->
    <g transform="translate(730 45)">
      <rect width="420" height="280" rx="16" fill="#0b1b12" stroke="#10b981" stroke-opacity=".35"/>
      <path d="M0 16 a16 16 0 0 1 16 -16 H404 a16 16 0 0 1 16 16 V34 H0 Z" fill="#0f261a"/>
      <circle cx="20" cy="17" r="4" fill="#10b981"/><circle cx="32" cy="17" r="4" fill="#047857"/><circle cx="44" cy="17" r="4" fill="#064e3b"/>
      <text class="p2-mono" x="210" y="21" text-anchor="middle" font-size="10.5" fill="#6ee7b7">SYSTEM TELEMETRY FORECAST</text>

      <!-- Waveform Graph Box -->
      <g transform="translate(24 55)">
        <rect width="372" height="120" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".25"/>
        <line x1="12" y1="60" x2="360" y2="60" stroke="#10b981" stroke-opacity=".2" stroke-dasharray="3 3"/>
        <line x1="12" y1="30" x2="360" y2="30" stroke="#ef4444" stroke-opacity=".5" stroke-dasharray="2 2"/>
        <text class="p2-mono" x="350" y="24" text-anchor="end" font-size="9" fill="#ef4444">CRITICAL ANOMALY THRESHOLD</text>

        <!-- Anomaly Curve -->
        <path d="M12 90 Q 50 45, 90 70 T 170 55 T 240 75 T 285 45 T 325 22 T 355 16" fill="none" stroke="#34d399" stroke-width="2.5"/>
        <circle cx="285" cy="45" r="4" fill="#eab308"/>
        <circle cx="325" cy="22" r="5" fill="#ef4444"/>
      </g>

      <!-- Status Footer Panel -->
      <g transform="translate(24 190)">
        <rect width="180" height="60" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".3"/>
        <text class="p2-mono" x="14" y="22" font-size="9.5" fill="#a7f3d0">INCIDENT RISK SCORE</text>
        <text class="p2-mono" x="14" y="44" font-size="13" font-weight="700" fill="#fde047">HIGH PROBABILITY</text>

        <rect x="192" width="180" height="60" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".3"/>
        <text class="p2-mono" x="206" y="22" font-size="9.5" fill="#a7f3d0">PROACTIVE MITIGATION</text>
        <text class="p2-mono" x="206" y="44" font-size="13" font-weight="700" fill="#10b981">AUTO-SCALED</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#10b981" stroke-opacity=".2"/>
  </g>
</svg>