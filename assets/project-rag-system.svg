<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">RAG Query System: Intelligent Document Retrieval &amp; Semantic Search</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1711"/><stop offset="1" stop-color="#050c08"/></linearGradient>
    <radialGradient id="p3-glow" cx="80%" cy="30%" r="55%"><stop offset="0" stop-color="#059669" stop-opacity=".45"/><stop offset="1" stop-color="#047857" stop-opacity="0"/></radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#10b981" stroke-opacity=".07"/></pattern>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="700" width="500" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    
    <!-- Left Column -->
    <text class="p3-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#34d399">03 · RETRIEVAL-AUGMENTED GENERATION · VECTOR SEARCH · 2026</text>
    <text class="p3-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.2" fill="#f0fdf4">RAG Query System</text>
    <text class="p3-sans" x="56" y="154" font-size="16.5" fill="#a7f3d0">Intelligent semantic search &amp; high-accuracy multi-document knowledge retrieval.</text>
    <text class="p3-mono" x="56" y="186" font-size="12" fill="#6ee7b7"><tspan fill="#34d399">BUILT ›</tspan> Custom chunking strategies, dense vector embeddings, context-aware LLM generation</text>
    <line x1="56" y1="212" x2="680" y2="212" stroke="#10b981" stroke-opacity=".25"/>
    
    <!-- Metrics Row -->
    <g transform="translate(56 248)">
      <text class="p3-serif" font-size="30" font-weight="300" fill="#f0fdf4">High-Accuracy</text>
      <text class="p3-sans" y="22" font-size="12" fill="#94a3b8">context-aware semantic search</text>
    </g>
    <g transform="translate(260 248)">
      <text class="p3-serif" font-size="30" font-weight="300" fill="#f0fdf4">Sub-Second</text>
      <text class="p3-sans" y="22" font-size="12" fill="#94a3b8">vector similarity querying</text>
    </g>
    <g transform="translate(450 248)">
      <text class="p3-serif" font-size="30" font-weight="300" fill="#f0fdf4">Production</text>
      <text class="p3-sans" y="22" font-size="12" fill="#94a3b8">REST API &amp; vector indexing</text>
    </g>

    <!-- Chips Row -->
    <g transform="translate(56 308)">
      <rect x="0" width="70" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="35" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Python</text>

      <rect x="80" width="76" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="118" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">FastAPI</text>

      <rect x="166" width="90" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="211" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">LangChain</text>

      <rect x="266" width="86" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="309" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Vector DB</text>

      <rect x="362" width="76" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="400" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">LLM APIs</text>
    </g>

    <!-- Right-Side Visual: RAG Architecture Pipeline Flow (x=730, y=45, w=420, h=280) -->
    <g transform="translate(730 45)">
      <rect width="420" height="280" rx="16" fill="#0b1b12" stroke="#10b981" stroke-opacity=".35"/>
      <path d="M0 16 a16 16 0 0 1 16 -16 H404 a16 16 0 0 1 16 16 V34 H0 Z" fill="#0f261a"/>
      <circle cx="20" cy="17" r="4" fill="#10b981"/><circle cx="32" cy="17" r="4" fill="#047857"/><circle cx="44" cy="17" r="4" fill="#064e3b"/>
      <text class="p3-mono" x="210" y="21" text-anchor="middle" font-size="10.5" fill="#6ee7b7">RAG SEMANTIC PIPELINE</text>

      <!-- Architecture Stages -->
      <g transform="translate(24 55)">
        <rect width="110" height="50" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".35"/>
        <text class="p3-mono" x="55" y="24" text-anchor="middle" font-size="10" fill="#a7f3d0">DOC CHUNKS</text>
        <text class="p3-mono" x="55" y="38" text-anchor="middle" font-size="9" fill="#94a3b8">Semantic Split</text>

        <line x1="110" y1="25" x2="132" y2="25" stroke="#34d399" stroke-width="1.5"/>

        <rect x="132" width="110" height="50" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".35"/>
        <text class="p3-mono" x="187" y="24" text-anchor="middle" font-size="10" fill="#a7f3d0">EMBEDDINGS</text>
        <text class="p3-mono" x="187" y="38" text-anchor="middle" font-size="9" fill="#94a3b8">Vector Space</text>

        <line x1="242" y1="25" x2="264" y2="25" stroke="#34d399" stroke-width="1.5"/>

        <rect x="264" width="108" height="50" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".35"/>
        <text class="p3-mono" x="318" y="24" text-anchor="middle" font-size="10" fill="#a7f3d0">VECTOR DB</text>
        <text class="p3-mono" x="318" y="38" text-anchor="middle" font-size="9" fill="#94a3b8">Cosine Match</text>
      </g>

      <!-- Query Output Console -->
      <g transform="translate(24 125)">
        <rect width="372" height="125" rx="10" fill="#06120b" stroke="#10b981" stroke-opacity=".4"/>
        <text class="p3-mono" x="16" y="26" font-size="11" fill="#34d399">USER QUERY › "Explain distributed consensus in Raft"</text>
        <text class="p3-mono" x="16" y="48" font-size="10.5" fill="#a7f3d0">&gt; Vector similarity search retrieved top-k chunks</text>
        <text class="p3-mono" x="16" y="70" font-size="10.5" fill="#6ee7b7">&gt; Augmented prompt synthesized with LLM API</text>
        <text class="p3-mono" x="16" y="92" font-size="10.5" fill="#f0fdf4">&gt; Hallucination-free answer generated (120ms)</text>
        <text class="p3-mono" x="16" y="112" font-size="10" fill="#94a3b8">Status: 200 OK · Accuracy: 98.4%</text>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#10b981" stroke-opacity=".2"/>
  </g>
</svg>