<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">Bench Management System: Project Allocation Platform</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1711"/><stop offset="1" stop-color="#050c08"/></linearGradient>
    <radialGradient id="p3-glow" cx="80%" cy="30%" r="55%"><stop offset="0" stop-color="#059669" stop-opacity=".45"/><stop offset="1" stop-color="#047857" stop-opacity="0"/></radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#10b981" stroke-opacity=".07"/></pattern>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="700" width="500" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    
    <!-- Left Column -->
    <text class="p3-mono" x="56" y="58" font-size="12" letter-spacing="2.6" fill="#34d399">03 · FULL-STACK · ENTERPRISE · RESOURCE PLATFORM · 2026</text>
    <text class="p3-serif" x="54" y="118" font-size="48" font-weight="300" letter-spacing="-1.2" fill="#f0fdf4">Bench Management System</text>
    <text class="p3-sans" x="56" y="154" font-size="16.5" fill="#a7f3d0">Scalable project allocation platform enabling efficient employee-project mapping.</text>
    <text class="p3-mono" x="56" y="186" font-size="12" fill="#6ee7b7"><tspan fill="#34d399">BUILT ›</tspan> Role-based dashboards, RESTful APIs, session persistence, Flutter Web UI</text>
    <line x1="56" y1="212" x2="680" y2="212" stroke="#10b981" stroke-opacity=".25"/>
    
    <!-- Metrics Row -->
    <g transform="translate(56 248)">
      <text class="p3-serif" font-size="30" font-weight="300" fill="#f0fdf4">FastAPI</text>
      <text class="p3-sans" y="22" font-size="12" fill="#94a3b8">REST backend architecture</text>
    </g>
    <g transform="translate(250 248)">
      <text class="p3-serif" font-size="30" font-weight="300" fill="#f0fdf4">Flutter Web</text>
      <text class="p3-sans" y="22" font-size="12" fill="#94a3b8">role-based dashboards</text>
    </g>
    <g transform="translate(450 248)">
      <text class="p3-serif" font-size="30" font-weight="300" fill="#f0fdf4">PostgreSQL</text>
      <text class="p3-sans" y="22" font-size="12" fill="#94a3b8">session auth &amp; persistence</text>
    </g>

    <!-- Chips Row -->
    <g transform="translate(56 308)">
      <rect x="0" width="76" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="38" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">FastAPI</text>

      <rect x="86" width="94" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="133" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">PostgreSQL</text>

      <rect x="190" width="98" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="239" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">Flutter Web</text>

      <rect x="298" width="86" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="341" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">REST APIs</text>

      <rect x="394" width="88" height="26" rx="13" fill="#0d2419" stroke="#10b981" stroke-opacity=".4"/>
      <text class="p3-mono" x="438" y="17" text-anchor="middle" font-size="11" fill="#6ee7b7">RBAC Auth</text>
    </g>

    <!-- Right-Side Visual: Allocation Platform UI Mockup (x=730, y=45, w=420, h=280) -->
    <g transform="translate(730 45)">
      <rect width="420" height="280" rx="16" fill="#0b1b12" stroke="#10b981" stroke-opacity=".35"/>
      <path d="M0 16 a16 16 0 0 1 16 -16 H404 a16 16 0 0 1 16 16 V34 H0 Z" fill="#0f261a"/>
      <circle cx="20" cy="17" r="4" fill="#10b981"/><circle cx="32" cy="17" r="4" fill="#047857"/><circle cx="44" cy="17" r="4" fill="#064e3b"/>
      <text class="p3-mono" x="210" y="21" text-anchor="middle" font-size="10.5" fill="#6ee7b7">RESOURCE ALLOCATION PLATFORM</text>

      <!-- Allocation Rows -->
      <g transform="translate(24 55)">
        <!-- Project 1 -->
        <rect width="372" height="52" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".3"/>
        <circle cx="22" cy="26" r="10" fill="#0d2419" stroke="#10b981"/>
        <text class="p3-mono" x="42" y="30" font-size="11" fill="#f0fdf4">Project Alpha (FastAPI / AI)</text>
        <rect x="272" y="14" width="88" height="24" rx="12" fill="#047857"/>
        <text class="p3-mono" x="316" y="30" text-anchor="middle" font-size="9.5" fill="#f0fdf4">ALLOCATED</text>

        <!-- Project 2 -->
        <g transform="translate(0 64)">
          <rect width="372" height="52" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".3"/>
          <circle cx="22" cy="26" r="10" fill="#0d2419" stroke="#34d399"/>
          <text class="p3-mono" x="42" y="30" font-size="11" fill="#f0fdf4">Flutter Mobile App Suite</text>
          <rect x="272" y="14" width="88" height="24" rx="12" fill="#10b981"/>
          <text class="p3-mono" x="316" y="30" text-anchor="middle" font-size="9.5" fill="#050c08" font-weight="700">IN REVIEW</text>
        </g>

        <!-- Project 3 -->
        <g transform="translate(0 128)">
          <rect width="372" height="52" rx="8" fill="#06120b" stroke="#10b981" stroke-opacity=".3"/>
          <circle cx="22" cy="26" r="10" fill="#0d2419" stroke="#6ee7b7"/>
          <text class="p3-mono" x="42" y="30" font-size="11" fill="#f0fdf4">PostgreSQL Cluster Migration</text>
          <rect x="272" y="14" width="88" height="24" rx="12" fill="#047857"/>
          <text class="p3-mono" x="316" y="30" text-anchor="middle" font-size="9.5" fill="#f0fdf4">COMPLETED</text>
        </g>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#10b981" stroke-opacity=".2"/>
  </g>
</svg>