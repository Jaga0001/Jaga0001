<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="sig-title">
  <title id="sig-title">Jagavantha — Engineering intelligence. Building resilient AI systems.</title>
  <defs>
    <linearGradient id="sig-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050c08"/>
      <stop offset="1" stop-color="#0a1711"/>
    </linearGradient>
    <radialGradient id="sig-glow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#059669" stop-opacity=".6"/>
      <stop offset="1" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sig-line" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#047857" stop-opacity="0"/>
      <stop offset=".5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sig-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .sig-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="1200" height="230" rx="20" fill="url(#sig-bg)"/>
  <rect width="1200" height="230" rx="20" fill="url(#sig-glow)"/>

  <text class="sig-serif" x="600" y="104" text-anchor="middle" font-size="76" font-style="italic" font-weight="300" letter-spacing="-1" fill="#6ee7b7">Jagavantha</text>

  <path d="M100 134 H1100" stroke="url(#sig-line)" stroke-width="1"/>
  <circle cx="600" cy="134" r="3" fill="#f0fdf4"/>

  <g>
    <text class="sig-serif" x="600" y="176" text-anchor="middle" font-size="20" font-style="italic" fill="#f0fdf4">Engineering intelligence. Building resilient AI systems.</text>
    <text class="sig-mono" x="600" y="206" text-anchor="middle" font-size="11" letter-spacing="3" fill="#94a3b8">AI ENGINEER · AGENTIC AI · LLMS · FASTAPI</text>
  </g>
