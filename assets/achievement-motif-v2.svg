<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="ach-title ach-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ach-title">Recognition &amp; Achievements</title>
  <desc id="ach-desc">3rd Prize at AI Innovate Hackathon (Sri Eshwar Engg College, cash prize Rs 10,000). Top 12 Finalist at Beach Hacks Season 07 (Christ Engg College). Top 8 Finalist at HackRx 6.0 (RV College). AI Epoch Club Vice President.</desc>

  <defs>
    <linearGradient id="ach-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1711"/>
      <stop offset="100%" stop-color="#050c08"/>
    </linearGradient>
    <radialGradient id="ach-glow-a" cx="85%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#059669" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ach-glow-b" cx="90%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ach-clip-a"><rect width="680" height="240" rx="16"/></clipPath>
    <clipPath id="ach-clip-b"><rect width="456" height="240" rx="16"/></clipPath>
  </defs>

  <style>
    .ach-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ach-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ach-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1200" height="430" rx="20" fill="url(#ach-bg)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="19.5" fill="none" stroke="#10b981" stroke-opacity=".2"/>

  <!-- Card 1: 3rd Prize AI Innovate Hackathon (x=24, y=24, w=680, h=240) -->
  <g transform="translate(24 24)">
    <g clip-path="url(#ach-clip-a)">
      <rect width="680" height="240" fill="#0b1b12"/>
      <rect width="680" height="240" fill="url(#ach-glow-a)"/>
      <text class="ach-serif" x="650" y="130" text-anchor="end" font-size="110" font-weight="300" letter-spacing="-4" fill="#6ee7b7" fill-opacity=".15">10,000</text>
    </g>
    <rect width="680" height="240" rx="16" fill="none" stroke="#10b981" stroke-opacity=".35"/>
    <text class="ach-mono" x="36" y="55" font-size="12" letter-spacing="2.6" fill="#34d399">SRI ESHWAR ENGINEERING COLLEGE · HACKATHON</text>
    <text class="ach-serif" x="34" y="112" font-size="44" font-weight="300" letter-spacing="-1" fill="#f0fdf4">3rd Prize &amp; Cash Award</text>
    <text class="ach-sans" x="36" y="152" font-size="15" fill="#a7f3d0">Accident Hotspot Prediction System</text>
    <text class="ach-sans" x="36" y="176" font-size="13" fill="#94a3b8">Predictive spatial modeling, data preprocessing &amp; high-risk zone analytics</text>
    <text class="ach-mono" x="36" y="208" font-size="11" fill="#34d399">AWARD: ₹10,000 CASH PRIZE</text>
  </g>

  <!-- Card 2: Beach Hacks Season 07 Finalist (x=720, y=24, w=456, h=240) -->
  <g transform="translate(720 24)">
    <g clip-path="url(#ach-clip-b)">
      <rect width="456" height="240" fill="#0b1b12"/>
      <rect width="456" height="240" fill="url(#ach-glow-b)"/>
      <text class="ach-serif" x="435" y="130" text-anchor="end" font-size="110" font-style="italic" font-weight="300" fill="#6ee7b7" fill-opacity=".15">TOP 12</text>
    </g>
    <rect width="456" height="240" rx="16" fill="none" stroke="#10b981" stroke-opacity=".3"/>
    <text class="ach-mono" x="32" y="55" font-size="11.5" letter-spacing="2.2" fill="#34d399">BEACH HACKS S07 · KERALA</text>
    <text class="ach-serif" x="30" y="112" font-size="44" font-weight="300" letter-spacing="-1" fill="#f0fdf4">Top 12 Finalist</text>
    <text class="ach-sans" x="32" y="152" font-size="15" fill="#a7f3d0">ATOM — Pre-Incident Platform</text>
    <text class="ach-sans" x="32" y="176" font-size="13" fill="#94a3b8">Selected among Top 12 teams out of 750+ registrations</text>
    <text class="ach-mono" x="32" y="208" font-size="11" fill="#34d399">PREDICTIVE RELIABILITY SYSTEM</text>
  </g>

  <!-- Animated Divider Line -->
  <line x1="24" y1="288" x2="1176" y2="288" stroke="#10b981" stroke-opacity=".25" stroke-width="1"/>

  <!-- Row 2: Secondary Highlights & Leadership (Clean Coordinates, y=315) -->
  <g transform="translate(24 315)">
    <!-- Column 1 -->
    <g transform="translate(20 0)">
      <text class="ach-mono" x="0" y="20" font-size="11" letter-spacing="2" fill="#34d399">HACKRX 6.0 · RV COLLEGE</text>
      <text class="ach-serif" x="0" y="52" font-size="25" font-weight="300" fill="#f0fdf4">Top 8 Finalist</text>
      <text class="ach-sans" x="0" y="74" font-size="12.5" fill="#94a3b8">Top 8 among 620+ participants · RAG Query System</text>
    </g>
    <!-- Column 2 -->
    <g transform="translate(410 0)">
      <text class="ach-mono" x="0" y="20" font-size="11" letter-spacing="2" fill="#34d399">AI EPOCH CLUB</text>
      <text class="ach-serif" x="0" y="52" font-size="25" font-weight="300" fill="#f0fdf4">Vice President</text>
      <text class="ach-sans" x="0" y="74" font-size="12.5" fill="#94a3b8">Led hands-on ML/DL workshops for 100+ members</text>
    </g>
    <!-- Column 3 -->
    <g transform="translate(790 0)">
      <text class="ach-mono" x="0" y="20" font-size="11" letter-spacing="2" fill="#34d399">PROMPTOMANIA</text>
      <text class="ach-serif" x="0" y="52" font-size="25" font-weight="300" fill="#f0fdf4">Lead Coordinator</text>
      <text class="ach-sans" x="0" y="74" font-size="12.5" fill="#94a3b8">Organized GenAI &amp; Gemini event for 200+ students</text>
    </g>
  </g>
</svg>