<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="GitHub stats and engineering metrics for jaga0001: 1,064 commits, 4 core architectures, hackathon finalist" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gs-bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08140e"/>
      <stop offset="60%" stop-color="#050e09"/>
      <stop offset="100%" stop-color="#030805"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="gs-border" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Column Card Background -->
    <linearGradient id="col-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e14" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06120b" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Pill Background -->
    <linearGradient id="pill-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <style>
    .gs-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .gs-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .gs-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Main Container -->
  <rect x="1" y="1" width="1198" height="378" rx="20" fill="url(#gs-bg)" stroke="url(#gs-border)" stroke-width="1.5"/>

  <!-- Header Section (y=24 to y=85) -->
  <g transform="translate(40, 0)">
    <!-- Category Tag -->
    <text class="gs-mono" x="0" y="42" font-size="11" font-weight="600" letter-spacing="2.5" fill="#34d399">05.1 TELEMETRY // REAL-TIME DEVELOPER METRICS</text>
    
    <!-- Title -->
    <text class="gs-serif" x="0" y="76" font-size="28" font-weight="300" letter-spacing="-0.5" fill="#f0fdf4">Engineering Velocity &amp; GitHub Telemetry</text>

    <!-- Right Side Status Badge -->
    <g transform="translate(930, 44)">
      <rect width="190" height="32" rx="16" fill="url(#pill-bg)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="20" cy="16" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text class="gs-mono" x="34" y="20" font-size="11" font-weight="600" fill="#6ee7b7">LIVE · @jaga0001</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="98" x2="1160" y2="98" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Row of 4 Perfectly Aligned Cards (w=262, gap=24, h=242, y=116) -->
  
  <!-- Card 1: Annual Velocity -->
  <g transform="translate(40, 116)">
    <rect width="262" height="240" rx="14" fill="url(#col-bg)" stroke="#10b981" stroke-opacity="0.24" stroke-width="1"/>
    <text class="gs-mono" x="22" y="34" font-size="10.5" font-weight="600" letter-spacing="2" fill="#34d399">01 // VELOCITY</text>
    <text class="gs-sans" x="22" y="82" font-size="40" font-weight="800" fill="#f0fdf4">1,064</text>
    <text class="gs-sans" x="22" y="112" font-size="14.5" font-weight="600" fill="#34d399">Tracked Commits</text>
    <text class="gs-sans" x="22" y="142" font-size="12" fill="#94a3b8">Daily public commit velocity</text>
    <text class="gs-sans" x="22" y="160" font-size="12" fill="#94a3b8">across AI systems &amp; backends.</text>
    <g transform="translate(22, 184)">
      <rect width="218" height="28" rx="6" fill="#08150e" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
      <text class="gs-mono" x="12" y="18" font-size="10.5" fill="#6ee7b7">12 MONTHS CONTINUOUS</text>
    </g>
  </g>

  <!-- Card 2: Production Code -->
  <g transform="translate(326, 116)">
    <rect width="262" height="240" rx="14" fill="url(#col-bg)" stroke="#10b981" stroke-opacity="0.24" stroke-width="1"/>
    <text class="gs-mono" x="22" y="34" font-size="10.5" font-weight="600" letter-spacing="2" fill="#34d399">02 // ARCHITECTURES</text>
    <text class="gs-sans" x="22" y="82" font-size="40" font-weight="800" fill="#f0fdf4">4<tspan font-size="22" font-weight="600" fill="#34d399"> Core</tspan></text>
    <text class="gs-sans" x="22" y="112" font-size="14.5" font-weight="600" fill="#34d399">Production Systems</text>
    <text class="gs-sans" x="22" y="142" font-size="12" fill="#94a3b8">Repo-Pilot (CI/CD), ATOM,</text>
    <text class="gs-sans" x="22" y="160" font-size="12" fill="#94a3b8">RAG Engine &amp; Spatial ML.</text>
    <g transform="translate(22, 184)">
      <rect width="218" height="28" rx="6" fill="#08150e" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
      <text class="gs-mono" x="12" y="18" font-size="10.5" fill="#6ee7b7">FASTAPI · LLMS · CREWAI</text>
    </g>
  </g>

  <!-- Card 3: Hackathon Honors -->
  <g transform="translate(612, 116)">
    <rect width="262" height="240" rx="14" fill="url(#col-bg)" stroke="#10b981" stroke-opacity="0.24" stroke-width="1"/>
    <text class="gs-mono" x="22" y="34" font-size="10.5" font-weight="600" letter-spacing="2" fill="#34d399">03 // RECOGNITION</text>
    <text class="gs-sans" x="22" y="82" font-size="40" font-weight="800" fill="#f0fdf4">Top 8<tspan font-size="20" font-weight="600" fill="#34d399"> &amp; 12</tspan></text>
    <text class="gs-sans" x="22" y="112" font-size="14.5" font-weight="600" fill="#34d399">Hackathon Honors</text>
    <text class="gs-sans" x="22" y="142" font-size="12" fill="#94a3b8">3rd Prize AI Innovate (₹10K)</text>
    <text class="gs-sans" x="22" y="160" font-size="12" fill="#94a3b8">Top 12 Beach Hacks (750+)</text>
    <g transform="translate(22, 184)">
      <rect width="218" height="28" rx="6" fill="#08150e" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
      <text class="gs-mono" x="12" y="18" font-size="10.5" fill="#6ee7b7">NATIONAL FINALIST</text>
    </g>
  </g>

  <!-- Card 4: Leadership & Impact -->
  <g transform="translate(898, 116)">
    <rect width="262" height="240" rx="14" fill="url(#col-bg)" stroke="#10b981" stroke-opacity="0.24" stroke-width="1"/>
    <text class="gs-mono" x="22" y="34" font-size="10.5" font-weight="600" letter-spacing="2" fill="#34d399">04 // MENTORSHIP</text>
    <text class="gs-sans" x="22" y="82" font-size="40" font-weight="800" fill="#f0fdf4">100+</text>
    <text class="gs-sans" x="22" y="112" font-size="14.5" font-weight="600" fill="#34d399">Engineers Mentored</text>
    <text class="gs-sans" x="22" y="142" font-size="12" fill="#94a3b8">Vice President, AI Epoch</text>
    <text class="gs-sans" x="22" y="160" font-size="12" fill="#94a3b8">Coordinator for Promptomania</text>
    <g transform="translate(22, 184)">
      <rect width="218" height="28" rx="6" fill="#08150e" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
      <text class="gs-mono" x="12" y="18" font-size="10.5" fill="#6ee7b7">COMMUNITY LEAD</text>
    </g>
